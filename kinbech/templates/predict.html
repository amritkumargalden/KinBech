<!-- templates/predict.html -->
{% extends 'base.html' %}

{% block title %}KinBech - Predict Price{% endblock %}

{% block content %}
<div class="container-lg">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-header bg-gradient text-white p-4">
                    <h3 class="mb-0">📦 Predict Your Item's Fair Price</h3>
                </div>
                
                <div class="card-body p-4">
                    {% if error %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        <strong>⚠️ Error:</strong> {{ error }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endif %}
                    
                    <form method="POST" action="/predict" id="predictionForm">
                        <div class="mb-3">
                            <label for="original_price" class="form-label">
                                <strong>Original Purchase Price (NPR)</strong>
                            </label>
                            <div class="input-group">
                                <span class="input-group-text">Rs</span>
                                <input type="number" class="form-control" id="original_price" 
                                       name="original_price" placeholder="50000" 
                                       required min="100" step="100">
                            </div>
                            <small class="text-muted">What did you originally pay?</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="age_years" class="form-label">
                                <strong>Item Age (Years)</strong>
                            </label>
                            <input type="number" class="form-control" id="age_years" 
                                   name="age_years" placeholder="2" required min="0" max="50" step="0.1">
                            <small class="text-muted">How long have you owned it?</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="condition" class="form-label">
                                <strong>Condition Score: <span id="conditionValue">5</span>/10</strong>
                            </label>
                            <input type="range" class="form-range" id="condition" 
                                   name="condition" min="1" max="10" value="5">
                            <div class="d-flex justify-content-between small text-muted">
                                <span>Poor</span>
                                <span>Excellent</span>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="storage_gb" class="form-label">
                                <strong>Storage (GB)</strong> - <em>Optional, for electronics</em>
                            </label>
                            <input type="number" class="form-control" id="storage_gb" 
                                   name="storage_gb" placeholder="256" min="0" step="1">
                        </div>
                        
                        <div class="mb-4">
                            <label for="category" class="form-label">
                                <strong>Category</strong>
                            </label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="">Select a category...</option>
                                {% for cat in categories %}
                                <option value="{{ cat }}">{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100">
                            🔮 Predict Fair Price
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('condition').addEventListener('input', function() {
    document.getElementById('conditionValue').textContent = this.value;
});
</script>
{% endblock %}
