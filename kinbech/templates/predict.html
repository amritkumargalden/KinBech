<!-- templates/predict.html -->
{% extends 'base.html' %} {% block content %}
<div class="predict-form">
  <h2>Estimate a Listing Price</h2>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="POST" action="/predict">
    <div class="form-group">
      <label for="category">Category</label>
      <select id="category" name="category" required>
        {% for category in categories %}
        <option value="{{ category }}">{{ category }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="condition">Condition</label>
      <select id="condition" name="condition" required>
        {% for condition in conditions %}
        <option value="{{ condition }}">{{ condition }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label for="storage_gb">Storage (GB)</label>
      <input type="number" id="storage_gb" name="storage_gb" min="0" required />
    </div>
    <div class="form-group">
      <label for="age_years">Age (years)</label>
      <input
        type="number"
        id="age_years"
        name="age_years"
        min="0"
        step="0.1"
        required
      />
    </div>
    <button type="submit" class="btn-primary">Predict Price</button>
  </form>
</div>
{% endblock %}
