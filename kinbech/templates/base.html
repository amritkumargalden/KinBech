<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Second Hand Product Value Predictor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="app-shell">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Second Hand Product Value Predictor</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item {% if request.endpoint == 'home' %}active{% endif %}">
                    Home
                </a>
                <a href="/predict" class="nav-item {% if request.endpoint == 'predict' %}active{% endif %}">
                    Predict Price
                </a>
                <a href="/dashboard" class="nav-item {% if request.endpoint == 'dashboard' %}active{% endif %}">
                    Market Trends
                </a>
                <a href="#" class="nav-item">
                    My Account
                </a>
                <a href="#" class="nav-item">
                    Support
                </a>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <!-- RIGHT PANEL -->
        <aside class="right-panel">
            {% block right_panel %}{% endblock %}
        </aside>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
